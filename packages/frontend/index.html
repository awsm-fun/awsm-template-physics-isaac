<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>physics-isaac — Awsm · Isaac robots · wasm threads</title>

    <!-- COOP/COEP shim for static hosts (GitHub Pages) that can't send the
         headers `crossOriginIsolated` needs. Must run before the wasm bundle.
         No-op when the server already isolates the page (Trunk / `task dev`). -->
    <script src="coi-serviceworker.js"></script>
    <link data-trunk rel="copy-file" href="coi-serviceworker.js" />

    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #0b0d12; color: #cdd3e0; font-family: system-ui, sans-serif; overflow: hidden; }
        /* The DOM (canvas + HUD) is built from Rust with Dominator — see
           src/main_thread.rs. These classes are its styling hooks. */
        .canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
        .hud { position: fixed; top: 10px; left: 12px; right: 12px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; color: #f4f7fb; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75); pointer-events: none; }
        .hud .key { color: #7fd1ff; }
        .hud-error { color: #ff8a80; font-weight: 600; }
        /* Stats panel (top right), driven from src/stats.rs. Hidden by
           default; the bottom-left Stats chip toggles it. One group per
           thread: a header button (name left, headline right) that toggles
           the rows under it. */
        .stats { position: fixed; top: 10px; right: 12px; z-index: 4; min-width: 330px; max-height: calc(100vh - 80px); overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.55; white-space: pre; color: #9fb4d8; background: rgba(10, 14, 22, 0.55); border: 1px solid rgba(127, 209, 255, 0.18); border-radius: 8px; padding: 6px 8px; backdrop-filter: blur(4px); }
        .stats-group, .stats-row { display: flex; justify-content: space-between; gap: 24px; }
        .stats-group { width: 100%; padding: 0 4px; border: 0; border-radius: 4px; background: none; color: #cfe0fb; font: inherit; text-align: left; cursor: pointer; }
        .stats-group:hover { background: rgba(127, 209, 255, 0.1); }
        .stats-group:focus-visible { outline: 1px solid #7fd1ff; }
        /* A group's rows; a nested row breaks down the row above it. */
        .stats-row { padding: 0 4px 0 calc(4px + 2ch); }
        .stats-row.stats-nested { padding-left: calc(4px + 4ch); color: #7f93b5; }
        .stats-row.stats-nested-2 { padding-left: calc(4px + 6ch); color: #7f93b5; }
        /* The poses keep arriving late, or a lane is over the frame budget
           (see src/stats.rs for exactly when). */
        .stats .stats-bad { color: #ff6a5e; font-weight: 700; }
        .stats-btn { position: fixed; bottom: 18px; left: 16px; z-index: 5; font: inherit; font-size: 12px; letter-spacing: 0.06em; color: #cfe0f5; background: rgba(10, 14, 22, 0.55); border: 1px solid rgba(127, 209, 255, 0.18); border-radius: 999px; padding: 7px 18px; cursor: pointer; backdrop-filter: blur(4px); transition: background 0.15s ease, border-color 0.15s ease; }
        .stats-btn:hover { background: rgba(20, 30, 48, 0.75); border-color: rgba(127, 209, 255, 0.45); }
        .stats-btn.active { background: rgba(20, 30, 48, 0.85); border-color: rgba(127, 209, 255, 0.6); color: #e8edf7; }

        /* Loading screen: static so it shows while the wasm downloads. Rust
           appends progress lines to #loading-log and fades it on Ready. */
        #loading { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: radial-gradient(120% 120% at 50% 20%, #141a26 0%, #0b0d12 60%, #06070a 100%); transition: opacity 0.5s ease; }
        #loading.done { opacity: 0; pointer-events: none; }
        #loading .title { font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: #e8edf7; text-align: center; line-height: 1.5; }
        #loading .title b { color: #76b900; font-weight: 600; }
        #loading .subtitle { display: block; margin-top: 6px; font-size: 13px; letter-spacing: 0.3em; color: #7f8ba1; }
        #loading .orb { width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 32% 30%, #ffffff 0%, #b8c4d6 18%, #2a3242 70%, #0b0d12 100%); box-shadow: 0 0 24px rgba(118, 185, 0, 0.35); animation: loading-bounce 1.1s cubic-bezier(0.28, 0, 0.55, 1) infinite alternate; }
        @keyframes loading-bounce { from { transform: translateY(-16px) scale(1); } to { transform: translateY(10px) scale(0.94, 1.06); } }
        #loading-log { width: min(620px, 86vw); height: 200px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; line-height: 1.6; color: #7f8ba1; mask-image: linear-gradient(to bottom, transparent 0%, black 35%); }
        #loading-log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #loading-log div:last-child { color: #b9e3ff; }
        /* ── Settings button + modal (src/resolution.rs) ─────────────────────
           Bottom-right pill opens a modal with the render-resolution slider. */
        .settings-btn { position: fixed; bottom: 18px; right: 16px; z-index: 5; font: inherit; font-size: 12px; letter-spacing: 0.06em; color: #cfe0f5; background: rgba(10, 14, 22, 0.55); border: 1px solid rgba(127, 209, 255, 0.18); border-radius: 999px; padding: 7px 18px; cursor: pointer; backdrop-filter: blur(4px); transition: background 0.15s ease, border-color 0.15s ease; }
        .settings-btn:hover { background: rgba(20, 30, 48, 0.75); border-color: rgba(127, 209, 255, 0.45); }
        .settings-overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(4, 6, 10, 0.6); backdrop-filter: blur(3px); }
        .settings-modal { position: relative; width: min(360px, 86vw); margin: 20px; padding: 22px 26px; color: #cfe0f5; font-family: system-ui, sans-serif; background: rgba(13, 18, 28, 0.96); border: 1px solid rgba(127, 209, 255, 0.22); border-radius: 12px; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5); }
        .settings-modal h2 { margin: 0 0 16px; font-size: 16px; letter-spacing: 0.05em; color: #e8edf7; text-align: center; }
        .settings-close { position: absolute; top: 8px; right: 12px; font: inherit; font-size: 20px; line-height: 1; color: #8fa3c4; background: none; border: 0; cursor: pointer; }
        .settings-close:hover { color: #e8edf7; }
        .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 12px 0; }
        .settings-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: #b9c6dd; }
        .settings-row .res-slider { width: 150px; accent-color: #7fd1ff; cursor: pointer; }
        .settings-hint { margin: 16px 0 0; font-size: 11.5px; line-height: 1.5; color: #8fa3c4; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="orb"></div>
        <div class="title">
            <div><b>Awsm</b> Renderer</div>
            <div><b>Isaac</b> Robots</div>
            <span class="subtitle">wasm threads</span>
        </div>
        <div id="loading-log"><div>loading code… (fetching + compiling the wasm bundle)</div></div>
    </div>
    <!-- wasm-opt stays off: it can strip the shared-memory import the threaded
         bootstrap needs. -->
    <link data-trunk rel="rust" data-wasm-opt="0" />

    <!-- Basis transcoder + worker for the bundle's KTX2 textures, same-origin
         (COEP require-corp). The URLs are built in render_thread.rs. -->
    <link data-trunk rel="copy-file" href="../../web/vendor/basis/basis_transcoder.js" data-target-path="vendor/basis" />
    <link data-trunk rel="copy-file" href="../../web/vendor/basis/basis_transcoder.wasm" data-target-path="vendor/basis" />
    <link data-trunk rel="copy-file" href="../../web/workers/basis-worker.js" data-target-path="workers" />

    <!-- The pose SOURCE: replays captures or reads ?stream=ws://… into the
         shared pose block (see the file header). -->
    <link data-trunk rel="copy-file" href="../../web/workers/pose-worker.js" data-target-path="workers" />

    <!-- The editor's player export (the robots, imported from the Isaac
         exporter's GLB + .mujoco.json) served at /bundle/, and the recorded
         joint sweeps the replay source loops, served at /captures/. -->
    <link data-trunk rel="copy-dir" href="../../media/bundle" />
    <link data-trunk rel="copy-dir" href="../../media/captures" />

    <!-- The robots' licenses ship with every deployment (BSD-3 asks for the
         notice alongside binary redistributions). -->
    <link data-trunk rel="copy-file" href="../../media/ASSET-LICENSES.md" />
</body>
</html>
